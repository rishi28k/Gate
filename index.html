<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1e3a5f">
<meta name="description" content="GATE study progress tracker">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<title>GATE Progress Tracker</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f3f6fa;color:#172033}
header{position:sticky;top:0;z-index:5;background:#f3f6fa;padding:12px;max-width:720px;margin:auto}
h1{font-size:24px;margin:4px 0 10px}.card{background:#fff;border-radius:16px;padding:14px;box-shadow:0 2px 10px #0001}
.stats{display:flex;justify-content:space-between;color:#5b6472;font-size:14px}.bar{height:9px;background:#e1e6ed;border-radius:99px;overflow:hidden;margin:9px 0}.fill{height:100%;width:0;background:#2563eb;transition:.2s}
button{min-height:44px;border:1px solid #d7dde5;background:#fff;border-radius:10px;padding:8px 13px;font-weight:650}
main{max-width:720px;margin:auto;padding:0 12px 30px}.subject{background:#fff;border-radius:16px;overflow:hidden;margin:12px 0;box-shadow:0 2px 10px #0000000d}
.subject h2{font-size:17px;margin:0;padding:13px 14px;background:#334e68;color:white}
.topic{display:flex;align-items:center;gap:12px;padding:11px 14px;border-top:1px solid #edf0f3;min-height:49px}
.topic input{width:22px;height:22px;accent-color:#2563eb}.topic.done span{text-decoration:line-through;color:#8a93a3}
.small{font-size:13px;color:#667085;margin-top:4px}
</style>
</head>
<body>
<header>
 <div class="card">
  <h1>📚 GATE Progress Tracker</h1>
  <div class="small">Tap a topic when you complete it.</div>
  <div class="bar"><div class="fill" id="fill"></div></div>
  <div class="stats"><span id="count">0 / 0 covered</span><span id="pct">0%</span></div>
  <button id="reset" type="button" style="margin-top:10px">Reset Progress</button>
 </div>
</header>
<main id="app"></main>
<script>
const data={
"Computer Networks":["IPV4 Addressing","Error Control","Flow Control","IPV4 Header & Fragmentation","TCP & UDP","Medium Access Control","Routing Protocols","Switching","Application Layer Protocols","IP Support protocol","OSI & TCP/Stack Protocol"],
"Operating Systems":["Introduction & Background","Process Management","CPU Scheduling","Process Synchronization","DeadLock","Memory Management","File System & Device Management","System Calls & Threads"],
"C - Programming":["Data Types & Operators","Control Flow Statements","Functions & Storage Classes","Arrays & Pointers","Strings","Structures & Union","Miscellaneous Topics"],
"Data Structures":["Introduction","Arrays","Linked List","Stack & Queues","Trees","Graphs","Hashing"],
"Digital Logic":["Logic Gates","Minimization","Combinational Circuit","Sequential Circuit","Number System"],
"Theory of Computation":["Finite Automata","Push Down Automata","Turning Machine Recursively Enumerable","Decidability"],
"Compiler Design":["Lexical & Syntax Analysis","Syntax Directed Translation","Intermediate Code & Code Optimization"],
"Algorithms":["Analysis Of Algorithms","Design Strategies","Greedy Method","Dynamic Programming","Graph Algorithms","Heap Algorithms","Backtracking & Branch-Bound"],
"Database Management System":["FD`s and Normalisation","Transaction and Concurrency Control","ER Model","Query Language","File Organisation & Indexing"],
"Computer Organisation & Architecture":["Introduction Of COA","Machine Instruction and Addressing Modes","Floating Point Representation","ALU and Control Unit","Instruction And Pipelining","Cache Memory","Secondary Memory & IO Interface"],
"Discrete Mathematics":["Graph Theory","Mathematical Logic","Set Theory","Combinatorics"],
"Engineering Mathematics":["Linear Algebra","Calculus","Probability & Statistics"],
"General Aptitude":["Averages","Percentages","Simple & Compound Intrest","Profit and Loss","Mixtures & Alligations","Ratio and Propotion","Counting Theory","Time and Work","Pipes and Cisterns","Speed, Distance and Time","Boats, Trains, Races","Mensuration 2D, 3D","Geometry","Data Interpretation","Probability","Set Theory","Permutation & Combinations","Calenders","Clocks","Number System","Blood Relations","Coding & Decoding","Directions","Arrangements and Rankings","Cubes & Dices","Venn Digrams","Paper Folding","Image Formations"]};
const key="gate-progress-v1", saved=JSON.parse(localStorage.getItem(key)||"{}"), app=document.getElementById("app");
let total=0;
for(const [subject,topics] of Object.entries(data)){
 const s=document.createElement("section");s.className="subject";
 const h=document.createElement("h2");h.textContent=subject;s.appendChild(h);
 topics.forEach((topic,i)=>{
  total++;const id=subject+"-"+i;const label=document.createElement("label");label.className="topic";
  const cb=document.createElement("input");cb.type="checkbox";cb.checked=!!saved[id];
  const span=document.createElement("span");span.textContent=topic;
  if(cb.checked)label.classList.add("done");
  cb.addEventListener("change",()=>{saved[id]=cb.checked;if(cb.checked)label.classList.add("done");else label.classList.remove("done");localStorage.setItem(key,JSON.stringify(saved));update()});
  label.append(cb,span);s.appendChild(label);
 });app.appendChild(s);
}
function update(){const done=Object.values(saved).filter(Boolean).length,p=total?Math.round(done/total*100):0;document.getElementById("count").textContent=`${done} / ${total} covered`;document.getElementById("pct").textContent=p+"%";document.getElementById("fill").style.width=p+"%"}
document.getElementById("reset").addEventListener("click",()=>{if(confirm("Reset all progress?")){localStorage.removeItem(key);location.reload()}});
update();
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
